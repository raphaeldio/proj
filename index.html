<!doctype html>
<html lang="id" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NusaTabur — Taburan Gizi untuk Pangan Pokok Indonesia</title>
    <meta
      name="description"
      content="Toping fortifikasi mikronutrien untuk nasi, kentang, singkong, dan jagung. Kemasan tanpa plastik sekali pakai, distribusi bertahap dari wilayah yang paling membutuhkan."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Terapkan tema sebelum paint pertama agar tidak ada kedipan terang.
      (function () {
        try {
          var stored = localStorage.getItem("nusatabur-theme");
          var dark =
            stored === "dark" ||
            (!stored &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* localStorage bisa diblokir — abaikan, default terang */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
